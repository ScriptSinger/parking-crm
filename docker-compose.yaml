services:
  php:
    build:
      context: .
      dockerfile: docker/php/php-fpm.dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    env_file:
      - ./.env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - php
    restart: unless-stopped

  mysql:
    image: mysql:9.3
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_db}
      MYSQL_USER: ${DB_USERNAME:-laravel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ironwolf12}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ironwolf12}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-ironwolf12}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  composer:
    build:
      context: .
      dockerfile: docker/composer/composer.dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    profiles:
      - tools

  artisan:
    build:
      context: .
      dockerfile: docker/php/php-fpm.dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    env_file:
      - ./.env
    volumes:
      - .:/var/www/html
    entrypoint: ["php", "artisan"]
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - tools

  npm:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    entrypoint: ["npm"]
    profiles:
      - tools

volumes:
  mysql_data:
